[package]
name = "jquants-api"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["uiuifree <info@uiuifree.com>"]
description = "Unofficial async Rust client for the J-Quants API v2 (Japanese stock market data by JPX)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uiuifree/rust-jquants-api"
homepage = "https://github.com/uiuifree/rust-jquants-api"
documentation = "https://docs.rs/jquants-api"
readme = "README.md"
keywords = ["jquants", "jpx", "stock", "finance", "japan"]
categories = ["api-bindings", "finance"]

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6"
